[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "log-analytics"
version = "0.1.0"
description = "LangGraph + Ollama log analytics over Parquet syslog data, with FastAPI, RAG and pgvector."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "polars>=1.30",
    "pyarrow>=17",
    "langgraph>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "numpy>=1.26",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
log-analytics = "log_analytics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/log_analytics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not realdata'"
markers = ["realdata: opt-in run against the real dataset (pytest -m realdata; LA_REALDATA_PATH overrides the path)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
